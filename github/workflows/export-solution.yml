name: Export and Unpack Solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution unique name (not display name)"
        required: true
        default: "ExpenseManagement"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOLUTION_NAME: ${{ inputs.solution_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify connection to Dev
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.DEV_ENV_URL }}
          app-id: ${{ secrets.APP_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

      - name: Export solution (unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENV_URL }}
          app-id: ${{ secrets.APP_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}.zip
          managed: false

      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solutions/
          git diff --cached --quiet || (git commit -m "chore: export ${{ env.SOLUTION_NAME }} from Dev" && git push)
